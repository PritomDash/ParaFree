<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ParaFree admin — today's provider dashboard</title>
<meta name="description" content="Private admin dashboard for ParaFree: today's requests, providers, cooldowns and quality-gate counts.">
<style>
  :root { --bg: #0f1115; --card: #171a21; --text: #e8eaed; --muted: #9aa0a6; --line: #2a2f3a; --accent: #4f8ef7; --warn: #d97706; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f7f9; --card: #fff; --text: #1d1f23; --muted: #5f6368; --line: #e3e5e8; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.note { color: var(--muted); margin: 0 0 16px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input { flex: 1 1 220px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
  button { padding: 8px 16px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; padding-left: 12px; white-space: nowrap; }
  .empty { color: var(--muted); }
  #status { color: var(--muted); margin: 0 0 12px; min-height: 1.5em; }
  #status.err { color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>Provider dashboard</h1>
  <p class="note">Today (UTC) — counts only: no text, keys or IP addresses are stored or shown. The password stays in this tab and is sent only to /api/process.</p>
  <form id="f">
    <label for="pw" style="position:absolute;left:-9999px">Admin password</label>
    <input id="pw" type="password" autocomplete="off" placeholder="Admin password" required>
    <button type="submit">Load</button>
  </form>
  <p id="status" role="status"></p>
  <div class="grid" id="out"></div>
</main>
<script>
(function () {
  'use strict';
  let pw = '';                                   // in memory only, never stored
  const $ = (id) => document.getElementById(id);
  function table(title, obj, fmt) {
    const s = document.createElement('section'), h = document.createElement('h2');
    h.textContent = title; s.appendChild(h);
    const rows = Object.entries(obj || {}).sort((a, b) => (Number(b[1]) || 0) - (Number(a[1]) || 0));
    if (!rows.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Nothing today.'; s.appendChild(p); return s; }
    const t = document.createElement('table');
    for (const [k, v] of rows) {
      const tr = t.insertRow(), a = tr.insertCell(), b = tr.insertCell();
      a.textContent = k; b.className = 'n'; b.textContent = fmt ? fmt(v) : String(v);
    }
    s.appendChild(t); return s;
  }
  function render(d) {
    const out = $('out'); out.textContent = '';
    out.appendChild(table('Requests per tool', d.requestsByTool));
    out.appendChild(table('Writing chunks per provider', d.chunksByProvider));
    out.appendChild(table('Chat / CV requests per provider', d.chatByProvider));
    out.appendChild(table('Tokens per provider (estimate)', d.tokensByProvider, (n) => Number(n).toLocaleString()));
    for (const k of ['minute', 'day', 'overload', 'timeout']) out.appendChild(table({ minute: '429 per-minute', day: '429 per-day', overload: 'Google 500/503 overload', timeout: 'Timeouts' }[k] + ' (by provider)', d.cooldownsByType && d.cooldownsByType[k]));
    const cooled = {};
    for (const c of d.cooled || []) cooled[c.entry + ' (' + c.kind + ')'] = c.cooling ? 'until ' + new Date(c.until).toLocaleTimeString() : 'awaiting probe';
    out.appendChild(table('Cooling now', cooled, (v) => v));
    out.appendChild(table('Quality-gate rejections', d.gateRejections));
    const g = d.gateway || {};
    out.appendChild(table('AI Gateway (transcription)', d.gateway ? {
      'spent, rolling 30 days': '$' + Number(g.spent30d || 0).toFixed(2), 'stops at': '$' + Number(g.capUsd || 4.5).toFixed(2),
      'route': g.disabledUntil ? 'off until ' + new Date(g.disabledUntil).toLocaleString() : (g.enabled ? 'on' : 'off'), 'calls, 30 days': g.calls30d || 0,
    } : {}, (v) => String(v)));
  }
  async function load() {
    $('status').className = ''; $('status').textContent = 'Loading…';
    try {
      const r = await fetch('/api/process', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'adminDashboard', adminPassword: pw }) });
      if (r.status === 401) { $('status').className = 'err'; $('status').textContent = 'Wrong password.'; return; }
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      $('status').textContent = 'Updated ' + new Date().toLocaleTimeString() + ' — ' + d.date + ' (UTC day)';
      render(d);
    } catch (e) { $('status').className = 'err'; $('status').textContent = 'Could not load: ' + e.message; }
  }
  $('f').addEventListener('submit', (e) => { e.preventDefault(); pw = $('pw').value; $('pw').value = ''; load(); });
})();
</script>
</body>
</html>
